[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-debug-agent"
version = "0.1.0"
description = "LLM-driven Android device debug/test/diagnosis agent (MCP server + CLI)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest"]

[project.scripts]
ada = "ada.cli:main"
ada-mcp = "ada.server:main"

[tool.setuptools.packages.find]
where = ["src"]
